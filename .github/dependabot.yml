version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The app is pinned to React 18 (and React Router 7, the last line that supports it)
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "react-router", "react-markdown", "remark-gfm"]
      data:
        patterns: ["@tanstack/*", "zustand", "powerbi-client"]
      server:
        patterns: ["express", "@types/express", "cors", "@types/cors", "dotenv", "axios"]
      tooling:
        patterns: ["vite", "@vitejs/*", "vitest", "typescript", "tsx", "oxlint", "tailwindcss", "@tailwindcss/*", "@playwright/test", "supertest", "@types/supertest", "concurrently", "@types/node", "@stencil/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
